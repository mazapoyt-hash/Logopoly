name: Скан рынка

# This is what makes the site work with no server: the scanner runs here on a
# schedule, and commits its results as JSON that GitHub Pages serves.
on:
  schedule:
    # Twice an hour, a few minutes after the candle closes so the exchange has
    # settled.
    #
    # NOT every 15 minutes: measured on this repository, a `*/15` schedule
    # fired once in 7.5 hours instead of ~30 times. GitHub deprioritises and
    # drops frequent cron schedules under load, so a high frequency here buys
    # nothing and quietly makes the site staler than it claims to be. Sparse
    # schedules are honoured far more reliably.
    #
    # Nothing is lost by scanning less often: new signals are decided on closed
    # 1h candles, so there is nothing new to find between them, and browser-side
    # prices keep the cards live regardless.
    - cron: '5,35 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/scan.yml'

concurrency:
  # Never let two runs commit to data/ at the same time.
  group: coinscope-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Прогнать скан
        id: scan
        env:
          COINSCOPE_SOURCE: binance
        run: node server/cli-scan.js | tee scan.log

      - name: Закоммитить данные
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Изменений нет."
            exit 0
          fi
          git commit -m "Данные скана: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another scheduled run may have landed while this one worked.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Не удалось запушить данные после трёх попыток"
          exit 1

      - name: Итог в сводку
        if: always()
        run: |
          {
            echo "# Скан рынка"
            echo
            echo '```'
            cat scan.log 2>/dev/null || echo "лог отсутствует"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
